<script>
// 存储每个属性关联的节点
var typeToNodes = {};

// 初始化：收集每个属性节点及其关联的精灵节点
function initTypeMapping() {
    var nodes = network.body.data.nodes.get();
    var edges = network.body.data.edges.get();

    nodes.forEach(function(node) {
        // 属性节点本身
        if (typeNamesSet.has(node.label)) {
            if (!typeToNodes[node.label]) typeToNodes[node.label] = [];
            typeToNodes[node.label].push(node.id);
        }
    });

    // 找出每个属性关联的精灵节点（通过边连接）
    edges.forEach(function(edge) {
        var fromNode = network.body.nodes[edge.from];
        var toNode = network.body.nodes[edge.to];
        if (fromNode && toNode) {
            // 如果 from 是属性，to 是精灵
            if (typeNamesSet.has(fromNode.options.label) && !typeNamesSet.has(toNode.options.label)) {
                if (!typeToNodes[fromNode.options.label]) typeToNodes[fromNode.options.label] = [];
                if (typeToNodes[fromNode.options.label].indexOf(toNode.id) === -1) {
                    typeToNodes[fromNode.options.label].push(toNode.id);
                }
            }
            // 如果 to 是属性，from 是精灵
            if (typeNamesSet.has(toNode.options.label) && !typeNamesSet.has(fromNode.options.label)) {
                if (!typeToNodes[toNode.options.label]) typeToNodes[toNode.options.label] = [];
                if (typeToNodes[toNode.options.label].indexOf(fromNode.id) === -1) {
                    typeToNodes[toNode.options.label].push(fromNode.id);
                }
            }
        }
    });
}

var typeNamesSet = new Set(["\u5149", "\u51b0", "\u5730", "\u5e7b", "\u5e7d", "\u6076", "\u666e\u901a", "\u673a\u68b0", "\u6b66", "\u6bd2", "\u6c34", "\u706b", "\u7535", "\u7ffc", "\u8349", "\u840c", "\u866b", "\u9f99"]);

function showType(typeName) {
    var nodesToShow = typeToNodes[typeName] || [];
    nodesToShow.forEach(function(nodeId) {
        network.body.data.nodes.update({id: nodeId, hidden: false});
    });
    // 同时显示属性节点本身
    network.body.data.nodes.update({id: typeName, hidden: false});
    network.redraw();
}

function hideType(typeName) {
    var nodesToHide = typeToNodes[typeName] || [];
    nodesToHide.forEach(function(nodeId) {
        network.body.data.nodes.update({id: nodeId, hidden: true});
    });
    network.body.data.nodes.update({id: typeName, hidden: true});
    network.redraw();
}

function showAll() {
    var allNodes = network.body.data.nodes.get();
    allNodes.forEach(function(node) {
        network.body.data.nodes.update({id: node.id, hidden: false});
    });
    network.redraw();
}

function hideAll() {
    var allNodes = network.body.data.nodes.get();
    allNodes.forEach(function(node) {
        network.body.data.nodes.update({id: node.id, hidden: true});
    });
    network.redraw();
}

// 等待 network 初始化完成
setTimeout(function() {
    if (typeof network !== 'undefined') {
        initTypeMapping();

        // 将迪莫和幽系节点的圆圈边框改为白色
        try {
            network.body.data.nodes.update([
                {id: "迪莫", borderWidth: 2, color: {border: "#FFFFFF"}},
                {id: "幽", borderWidth: 2, color: {border: "#FFFFFF"}}
            ]);
        } catch(e) {}

        // 绑定按钮事件
        var buttons = document.querySelectorAll('.type-toggle');
        buttons.forEach(function(btn) {
            var typeName = btn.getAttribute('data-type');
            var isVisible = true;  // 初始全部可见
            btn.addEventListener('click', function() {
                if (isVisible) {
                    hideType(typeName);
                    btn.style.opacity = '0.5';
                    btn.style.textDecoration = 'line-through';
                    isVisible = false;
                } else {
                    showType(typeName);
                    btn.style.opacity = '1';
                    btn.style.textDecoration = 'none';
                    isVisible = true;
                }
            });
        });

        document.getElementById('show-all').addEventListener('click', showAll);
        document.getElementById('hide-all').addEventListener('click', hideAll);
    }
}, 500);
</script>
